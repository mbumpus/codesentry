# Bug Tracker

- id: BUG-001
  severity: high
  pattern: CS002
  title: "False positives on legitimate Python decorator stubs"
  description: |
    CS002 flags @abstractmethod, @overload decorated methods and Protocol 
    stub methods as "placeholder code". These are legitimate Python patterns 
    that MUST have empty bodies (pass or ...).
  affected_patterns:
    - "@abstractmethod decorated methods"
    - "@overload decorated type hint stubs"
    - "Protocol class stub methods"
    - "@staticmethod and @classmethod stubs in abstract classes"
  expected: "Should NOT flag decorated stubs that are intentionally empty"
  actual: "Flags them as CS002 errors"
  reproduction: |
    from abc import ABC, abstractmethod
    from typing import Protocol, overload
    
    class MyInterface(ABC):
        @abstractmethod
        def process(self):
            pass  # Flagged incorrectly
    
    class Readable(Protocol):
        def read(self) -> str:
            ...  # Flagged incorrectly
    
    @overload
    def process(x: int) -> int: ...  # Flagged incorrectly
  fix_suggestion: |
    Check for decorators before flagging. Skip functions with:
    - @abstractmethod decorator
    - @overload decorator  
    - Any method in a class inheriting from ABC or Protocol
  status: resolved
  found_by: QAEngineer
  found_date: 2026-01-31
  fixed_by: AIAgentDeveloper
  fixed_date: 2026-01-31
  verified_by: QAEngineer
  verified_date: 2026-01-31
  fix_notes: |
    Added decorator checking (_get_decorator_names, _is_legitimate_stub) 
    and Protocol/ABC class detection (_find_protocol_classes).
  verification_notes: |
    Verified: test_cs002_legitimate_stubs.py returns 0 issues (exit code 0).
    All @abstractmethod, Protocol, and @overload patterns correctly skipped.

- id: BUG-002
  severity: medium
  pattern: CS002
  title: "CS002 flags stubs without TODO/FIXME (spec says 'paired with')"
  description: |
    The spec explicitly states CS002 should detect "TODO/FIXME comments 
    PAIRED WITH placeholder implementations". However, the current implementation 
    flags ANY function with just pass/... body, even without TODO comments.
    This produces false positives on intentional stub patterns.
  expected: "Should only flag placeholder code when TODO/FIXME is present nearby"
  actual: "Flags all stub functions regardless of TODO presence"
  spec_reference: |
    patterns.CS002.description: "TODO/FIXME comments paired with placeholder 
    implementations - LLMs generate stubs they never filled in"
  reproduction: |
    # No TODO/FIXME anywhere
    def my_stub():
        pass  # Flagged even without TODO
  fix_suggestion: |
    Make TODO/FIXME presence a REQUIRED condition, not optional.
    Only flag when placeholder body is found AND TODO/FIXME is nearby.
  status: resolved
  found_by: QAEngineer
  found_date: 2026-01-31
  fixed_by: AIAgentDeveloper
  fixed_date: 2026-01-31
  verified_by: QAEngineer
  verified_date: 2026-01-31
  fix_notes: |
    Removed fallback `return is_placeholder`. Now _is_placeholder_function() 
    only returns True if _has_todo_nearby() is True.
  verification_notes: |
    Verified: test_cs002_placeholder.py now returns 3 issues (was 4).
    stub_function() without TODO is correctly NOT flagged.

- id: BUG-003
  severity: low
  pattern: CS004
  title: "Missing 'mock' in placeholder value indicators"
  description: |
    Variables named with "mock" (e.g., MOCK_API_KEY) should be considered 
    test/placeholder values and not flagged as hardcoded secrets. 
    The placeholder list includes 'fake' and 'test' but not 'mock'.
  expected: "MOCK_API_KEY = 'sk-...' should NOT trigger CS004"
  actual: "Flagged as hardcoded secret"
  reproduction: |
    MOCK_API_KEY = "sk-mock1234567890abcdefghijklmnopqrstuvwxyz1234567"
    # Flagged even though variable name clearly indicates mock/test value
  fix_suggestion: |
    Add 'mock' to the placeholders tuple in _looks_like_secret():
    placeholders = ('xxx', 'your-', 'example', 'placeholder', 'changeme', 
                   'insert', 'replace', '<', '>', 'test', 'fake', 'dummy', 'mock')
  status: open
  found_by: QAEngineer
  found_date: 2026-01-31

