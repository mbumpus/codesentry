[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesentry"
version = "0.1.0"
description = "AI-Powered Pattern-Aware Code Analysis & Developer Education Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "CodeSentry Team"}
]
keywords = [
    "linter",
    "code-analysis",
    "anti-patterns",
    "education",
    "python",
    "static-analysis"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
rich = [
    "rich>=13.0",
]

[project.scripts]
codesentry = "codesentry.cli:main"

[project.urls]
Homepage = "https://github.com/codesentry/codesentry"
Documentation = "https://github.com/codesentry/codesentry#readme"
Repository = "https://github.com/codesentry/codesentry"
Issues = "https://github.com/codesentry/codesentry/issues"

[tool.setuptools.packages.find]
include = ["codesentry*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]  # Line too long - we handle manually

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
